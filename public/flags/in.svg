<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="100%" height="100%">
  <rect width="900" height="200" fill="#FF9933" />
  <rect y="200" width="900" height="200" fill="#FFFFFF" />
  <rect y="400" width="900" height="200" fill="#138808" />
  <g transform="translate(450, 300)">
    <circle r="85" fill="none" stroke="#000080" stroke-width="7" />
    <circle r="17" fill="#000080" />
    <!-- 24 Spokes of Ashoka Chakra -->
    <g stroke="#000080" stroke-width="3.5">
      <line x1="0" y1="-85" x2="0" y2="85" />
      <line x1="-85" y1="0" x2="85" y2="0" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(15)" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(30)" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(45)" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(60)" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(75)" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(90)" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(105)" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(120)" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(135)" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(150)" />
      <line x1="0" y1="-85" x2="0" y2="85" transform="rotate(165)" />
    </g>
    <!-- 24 Circular nodes around perimeter -->
    <g fill="#000080">
      <circle cx="0" cy="-78" r="3.5" />
      <circle cx="0" cy="78" r="3.5" />
      <circle cx="-78" cy="0" r="3.5" />
      <circle cx="78" cy="0" r="3.5" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(15)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(30)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(45)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(60)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(75)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(105)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(120)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(135)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(150)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(165)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(195)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(210)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(225)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(240)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(255)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(285)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(300)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(315)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(330)" />
      <circle cx="0" cy="-78" r="3.5" transform="rotate(345)" />
    </g>
  </g>
</svg>
