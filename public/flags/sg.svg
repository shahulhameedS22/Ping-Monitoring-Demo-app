    <!-- Star 3 (Bottom Right: ~306 deg) -->
    <polygon points="261,162 265,174 278,174 267,182 271,194 261,187 251,194 255,182 244,174 257,174" />
    <!-- Star 4 (Bottom Left: ~234 deg) -->
    <polygon points="219,162 223,174 236,174 225,182 229,194 219,187 209,194 213,182 202,174 215,174" />
    <!-- Star 5 (Top Left: ~162 deg) -->
